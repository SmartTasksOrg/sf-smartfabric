# CI: tests and the install-line check on every push to the default branch and
# every pull request. Actions are pinned to commits (comment: tag, date read).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - run: python -m sf_smartfabric --demo
      - run: python -m sf_smartfabric vectors
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0, read 2026-10-08
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1, read 2026-10-08
        with:
          distribution: temurin
          java-version: '21'
      - name: Live FAB-L-* harness over the wire (in-process node)
        run: python -m sf_smartfabric live
      - name: Cross-language conformance (every port whose toolchain the runner has must agree)
        run: bash ports/conformance/run.sh

  wheel:
    # What a PyPI user gets: build the wheel, install it in a clean environment and run the
    # commands that read bundled files, from an empty folder (no source tree to fall back on).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install it in a clean environment and run it from an empty folder
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          mkdir "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          "$RUNNER_TEMP/venv/bin/sf-smartfabric" --demo
          "$RUNNER_TEMP/venv/bin/sf-smartfabric" vectors
          "$RUNNER_TEMP/venv/bin/python" -c "import json; from sf_smartfabric import fingerprint, _bundled; errs = fingerprint.validate(json.loads(_bundled.read_text('schema', 'example.fingerprint.json'))); assert errs == [], errs"

  install-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - name: No document names a package the maintainers do not hold
        run: python scripts/check_install_lines.py
