[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartfabric"
version = "0.5.1"
description = "IAIso Fabric Protocol (IFP) — carry & enforce IAIso containment across a fleet of governed AI nodes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "SmartTasks", email = "enterprise@smarttasks.cloud" },
]
keywords = ["iaiso", "ai-safety", "governance", "fabric", "protocol", "containment", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://iaiso.org"
Source = "https://github.com/SmartTasksOrg/sf-smartfabric"
Issues = "https://github.com/SmartTasksOrg/sf-smartfabric/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartfabric/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartfabric/blob/master/CHANGELOG.md"
Standard = "https://github.com/SmartTasksOrg/IAISO"
Cloud = "https://smarttasks.cloud"

[project.scripts]
sf-smartfabric = "sf_smartfabric.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_smartfabric = ["py.typed", "data/schema/*.json", "data/examples/*.json", "data/spec/vectors/*.json"]
# The normative schema/, examples/ and spec/vectors/ live at the repo root (spec-first
# layout, like the rest of the Smart* family). The wheel carries identical copies under
# src/sf_smartfabric/data/ so `--demo`, `vectors` and `validate` work from a PyPI install;
# tests/test_bundled_data.py fails if a copy differs from its source.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
