# DigitalOcean App Platform spec for a SmartFabric node.
#   doctl apps create --spec app.yaml
name: smartfabric-node
services:
  - name: node
    image:
      registry_type: GHCR
      registry: smarttasksorg
      repository: sf-smartfabric
      tag: latest
    run_command: sf-smartfabric serve --host 0.0.0.0 --port 8770
    http_port: 8770
    health_check:
      http_path: /health
    instance_size_slug: basic-xxs
    instance_count: 1
