# Render.com blueprint for a SmartFabric node (Docker runtime).
services:
  - type: web
    name: smartfabric-node
    runtime: image
    image:
      url: ghcr.io/smarttasksorg/sf-smartfabric:0.5.0   # publish this first
    dockerCommand: serve --host 0.0.0.0 --port 8770
    healthCheckPath: /health
    envVars:
      - key: SMARTFABRIC_PORT
        value: "8770"
    plan: free
