name: "SmartFabric Conformance"
description: "Run IAIso Fabric Protocol (IFP) conformance checks on a node fingerprint in CI."
branding:
  icon: "grid"
  color: "purple"

inputs:
  fingerprint:
    description: "Path to the node fingerprint JSON to check."
    required: true
    default: "fingerprint.json"
  fail-on:
    description: "Minimum severity that fails the build: error | warning."
    required: false
    default: "error"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install smartfabric
      shell: bash
      run: pip install smartfabric
    - name: Run static conformance (FAB-*) on the fingerprint
      shell: bash
      run: |
        smartfabric check "${{ inputs.fingerprint }}" --fail-on "${{ inputs.fail-on }}"
    - name: Run behavioral vectors
      shell: bash
      run: smartfabric vectors
    # Note: the live FAB-L-* harness (smartfabric live) needs a running node.
    # Start one in a prior job/service and pass its URL:
    #   smartfabric live --url http://localhost:8770
